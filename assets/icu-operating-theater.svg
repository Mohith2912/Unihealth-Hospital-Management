<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="monitorBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background Surgical Suite -->
  <rect width="400" height="240" fill="#0b1b24"/>
  <rect width="400" height="240" fill="url(#lampGlow)"/>

  <!-- Telemetry Monitor Left -->
  <rect x="25" y="30" width="110" height="70" rx="4" fill="url(#monitorBg)" stroke="#1e293b" stroke-width="2"/>
  <path d="M30 65 h20 l5 -15 l8 30 l8 -35 l6 20 h35" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <path d="M30 85 h15 l6 -10 l6 20 l8 -15 h40" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round"/>
  <text x="32" y="44" fill="#38bdf8" font-family="monospace" font-size="8">HR: 74 BPM</text>
  <text x="85" y="44" fill="#4ade80" font-family="monospace" font-size="8">SpO2: 99%</text>

  <!-- Surgical Overhead Lamp -->
  <ellipse cx="200" cy="25" rx="65" ry="16" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <ellipse cx="200" cy="27" rx="50" ry="10" fill="#ffffff" filter="drop-shadow(0 0 10px #ffffff)"/>

  <!-- Surgeon 1 (Left) in Teal Scrubs -->
  <g>
    <!-- Body -->
    <path d="M120 180 c0 -35 25 -55 50 -55 c25 0 50 20 50 55 z" fill="#0e7490"/>
    <!-- Head & Mask -->
    <circle cx="170" cy="100" r="18" fill="#fcd34d"/>
    <path d="M152 95 c0 -12 8 -22 18 -22 s18 10 18 22 z" fill="#0891b2"/>
    <rect x="156" y="100" width="28" height="15" rx="3" fill="#e0f2fe"/>
    <line x1="156" y1="105" x2="184" y2="105" stroke="#0e7490" stroke-width="1"/>
  </g>

  <!-- Surgeon 2 (Right) in Teal Scrubs -->
  <g>
    <!-- Body -->
    <path d="M230 180 c0 -35 25 -55 50 -55 c25 0 50 20 50 55 z" fill="#0e7490"/>
    <!-- Head & Mask -->
    <circle cx="280" cy="100" r="18" fill="#fcd34d"/>
    <path d="M262 95 c0 -12 8 -22 18 -22 s18 10 18 22 z" fill="#0891b2"/>
    <rect x="266" y="100" width="28" height="15" rx="3" fill="#e0f2fe"/>
    <line x1="266" y1="105" x2="294" y2="105" stroke="#0e7490" stroke-width="1"/>
  </g>

  <!-- Operating Table -->
  <rect x="100" y="175" width="220" height="30" rx="4" fill="#334155"/>
  <rect x="110" y="170" width="200" height="8" rx="2" fill="#94a3b8"/>
</svg>