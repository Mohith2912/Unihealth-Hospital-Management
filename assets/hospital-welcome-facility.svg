<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8dce6"/>
      <stop offset="100%" stop-color="#eaf4f7"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="50%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </linearGradient>
  </defs>
  <rect width="240" height="120" rx="8" fill="url(#bgSky)"/>

  <!-- Hospital Wing -->
  <rect x="20" y="30" width="200" height="75" rx="3" fill="url(#facade)"/>
  
  <!-- Windows -->
  <g fill="#38bdf8" opacity="0.6">
    <rect x="30" y="42" width="25" height="18" rx="1"/>
    <rect x="62" y="42" width="25" height="18" rx="1"/>
    <rect x="94" y="42" width="25" height="18" rx="1"/>
    <rect x="126" y="42" width="25" height="18" rx="1"/>
    <rect x="158" y="42" width="25" height="18" rx="1"/>
    <rect x="190" y="42" width="20" height="18" rx="1"/>
  </g>

  <!-- Big Green Hospital Sign -->
  <rect x="35" y="16" width="170" height="22" rx="3" fill="#00838f" stroke="#004d40" stroke-width="1"/>
  <rect x="42" y="20" width="14" height="14" rx="2" fill="#ffffff"/>
  <path d="M49 22v10M44 27h10" stroke="#00838f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="62" y="31" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="bold" letter-spacing="0.5">EASWARI GENERAL HOSPITAL</text>

  <!-- Ground -->
  <rect x="0" y="102" width="240" height="18" fill="#94a3b8"/>
  <rect x="95" y="75" width="50" height="27" fill="#1e293b"/>
  <rect x="100" y="78" width="18" height="24" fill="#cbd5e1" opacity="0.9"/>
  <rect x="122" y="78" width="18" height="24" fill="#cbd5e1" opacity="0.9"/>
</svg>